<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>観覧 — 運行中の世界（3D）</title>
<style>
  html, body { margin: 0; padding: 0; background: #060a14; color: #dfe8f5; font-family: sans-serif; height: 100%; overflow: hidden; touch-action: none; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; top: 10px; left: 12px; font-size: 13px; line-height: 1.6; pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 5; }
  #hud .clock { font-size: 18px; font-weight: bold; }
  #log { position: absolute; left: 12px; bottom: 10px; font-size: 12px; line-height: 1.7; pointer-events: none; text-shadow: 0 1px 3px #000; opacity: 0.92; z-index: 5; }
  #ships { position: absolute; top: 10px; right: 12px; font-size: 12px; line-height: 1.7; text-align: right; pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 5; }
  #views { position: absolute; bottom: 10px; right: 12px; z-index: 6; display: flex; gap: 6px; }
  #views button { background: rgba(20,32,54,0.85); color: #cfe0f5; border: 1px solid #3a5070; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #views button.on { background: #2b4a73; border-color: #6f9fd8; color: #fff; }
  .lbl { position: absolute; transform: translate(26px, -50%); font-size: 12px; color: #d7e6fa; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: nowrap; z-index: 4; }
  .lbl small { color: #93a9c8; font-size: 11px; }
  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #7d92b2; pointer-events: none; z-index: 5; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>
<div id="hud"><div class="clock" id="clock">—</div><div>つむぎ宙域（観覧モード）</div></div>
<div id="ships"></div>
<div id="log"></div>
<div id="views">
  <button id="flipBtn" title="視点を軌道面の反対側へ回す">上下反転</button>
  <button data-v="wide" class="on">宙域全体</button>
  <button data-v="host">つむぎ近傍</button>
  <button data-v="moon">こよみ近傍</button>
  <button data-v="ship" id="shipBtn">船を追う</button>
</div>
<div id="hint">ドラッグで回転／ホイールで拡大縮小</div>
<script src="three.min.js"></script>
<script>if(!window.THREE){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');}</script>
<script src="flight-core.js"></script>
<script src="world-drive.js"></script>
<script src="schedule.js"></script>
<script>
'use strict';
const SCHED = window.WATCH_SCHEDULE;
const world = WorldDrive.createWorld(SCHED.sys, SCHED.stationDef);
for (const s of SCHED.ships) WorldDrive.addShip(world, s.id, s.name);
for (const f of SCHED.filings) WorldDrive.filePlan(world, f);
const shipNames = {}; for (const s of SCHED.ships) shipNames[s.id] = s.name;
const shipRoutes = {}; for (const f of SCHED.filings) shipRoutes[f.shipId] = f.fromName + ' → ' + f.toName;

const SPEED = 8; /* 世界の基準速度（#149） */
const t0 = performance.now();
const T_OFFSET = Math.max(0, Number(new URLSearchParams(location.search).get('t')) || 0); /* ?t=秒 で世界の途中から */
let shownEvents = 0;

/* 世界座標 → Three 座標：軌道面が XZ 平面になるよう (x, z, -y) へ置く */
const V3 = (b) => new THREE.Vector3(b.x, b.z, -b.y);

/* --- Three.js の場 --- */
const container = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a14);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 20000000);
scene.add(new THREE.AmbientLight(0x8899bb, 0.7));
const sunLight = new THREE.DirectionalLight(0xfff2d8, 1.1);
scene.add(sunLight);

/* 星空（背景の点）：カメラに追随させて常に周囲に広げる */
let starPoints;
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u) * 6000000;
    pos.set([r * Math.cos(th), u * 6000000, r * Math.sin(th)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  starPoints = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xafc4e8, size: 9000, sizeAttenuation: true, fog: false }));
  scene.add(starPoints);
}

/* 天体は実寸で描く（表示ドクトリン）。見えない大きさの対象には情報層の
   マーカーとラベルを重ねる */
function bodyMesh(radius, color) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(Math.max(radius, 1), 40, 28),
    new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.05 }));
  scene.add(m); return m;
}
function orbitLine(color, opacity) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3 * 181), 3));
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
  l.frustumCulled = false;
  scene.add(l); return l;
}
/* 軌道ガイドは実際の軌道面に合わせて描く：宿主相対の位置 r と速度 v から
   法線（角運動量）を求め、その面内の円にする。軌道面は世界の基本面と
   一致しない（あおばの軌道は大きく傾いている）ため、面を固定で描くと
   ステーションがガイドから外れて見える */
const _r = new THREE.Vector3(), _v = new THREE.Vector3(), _n = new THREE.Vector3(), _e2 = new THREE.Vector3();
const orbitNormals = {}; /* 軌道面の法線（Three 座標）。視点の極軸に使う */
function setOrbitCircle(line, centerPos, bodyPos, bodyVel, hostVel, key) {
  _r.copy(bodyPos).sub(centerPos);
  const radius = _r.length();
  _v.set(bodyVel.vx - hostVel.vx, bodyVel.vz - hostVel.vz, -(bodyVel.vy - hostVel.vy));
  _n.crossVectors(_r, _v).normalize();
  if (key) orbitNormals[key] = _n.clone();
  _e2.crossVectors(_n, _r.clone().normalize());
  const e1 = _r.clone().normalize();
  const attr = line.geometry.getAttribute('position');
  for (let i = 0; i <= 180; i++) {
    const a = i / 180 * Math.PI * 2;
    const px = centerPos.x + (e1.x * Math.cos(a) + _e2.x * Math.sin(a)) * radius;
    const py = centerPos.y + (e1.y * Math.cos(a) + _e2.y * Math.sin(a)) * radius;
    const pz = centerPos.z + (e1.z * Math.cos(a) + _e2.z * Math.sin(a)) * radius;
    attr.setXYZ(i, px, py, pz);
  }
  attr.needsUpdate = true;
}
function marker(color) {
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(1),
    new THREE.MeshBasicMaterial({ color }));
  scene.add(m); return m;
}

const hostMesh = bodyMesh(6400, 0x8fe3a0);
const moonMesh = bodyMesh(2600, 0x9fb4c8);
const stationMesh = bodyMesh(40, 0x2dd4bf);
const moonMark = marker(0x9fb4c8);
const moonOrbit = orbitLine(0x7d9cc4, 0.6);
const stationOrbit = orbitLine(0x2dd4bf, 0.75);
const stationMark = marker(0x2dd4bf);
const shipMarks = {}, shipTrails = {}, shipDestLines = {};
for (const s of SCHED.ships) {
  shipMarks[s.id] = marker(0xffbe78);
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  /* 目的地線は航跡（船色の実線）と混同しないよう、色を落としたグレーにする */
  const dl = new THREE.Line(dg, new THREE.LineDashedMaterial({ color: 0x8fa3b8, dashSize: 14000, gapSize: 9000, transparent: true, opacity: 0.55 }));
  dl.frustumCulled = false;
  scene.add(dl);
  shipDestLines[s.id] = dl;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3 * 6000), 3));
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffbe78, transparent: true, opacity: 0.45 }));
  line.frustumCulled = false;
  scene.add(line);
  shipTrails[s.id] = { line, pts: [], lastT: -1 };
}

/* ラベル（情報層：画面上で大きさ一定の HTML） */
const labelBox = document.getElementById('labels');
function makeLabel(html) { const d = document.createElement('div'); d.className = 'lbl'; d.innerHTML = html; labelBox.appendChild(d); return d; }
const hostLabel = makeLabel('つむぎ');
const moonLabel = makeLabel('こよみ');
const stationLabel = makeLabel('あおば <small>ステーション</small>');
const shipLabels = {}; for (const s of SCHED.ships) shipLabels[s.id] = makeLabel(s.name);
const tmpV = new THREE.Vector3();
function placeLabel(el, pos, show, dy) {
  tmpV.copy(pos).project(camera);
  if (!show || tmpV.z > 1 || tmpV.z < -1) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.style.left = (tmpV.x * 0.5 + 0.5) * innerWidth + 'px';
  el.style.top = ((-tmpV.y * 0.5 + 0.5) * innerHeight + (dy || 0)) + 'px';
}

/* --- 視点 --- */
let viewMode = 'wide';
let az = 0.7, pol = 1.05, dist = 1080000;
const DIST = { wide: 1080000, host: 90000, moon: 60000, ship: 26000 };
{ const q = new URLSearchParams(location.search).get('v');
  if (q && DIST[q]) { viewMode = q; dist = DIST[q];
    document.querySelectorAll('#views button[data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === q)); } }
document.querySelectorAll('#views button[data-v]').forEach(b => b.addEventListener('click', () => {
  viewMode = b.dataset.v;
  document.querySelectorAll('#views button[data-v]').forEach(x => x.classList.toggle('on', x === b));
  dist = DIST[viewMode];
}));
/* 上下反転: 極角を反対側へ倒し、軌道面の下から見上げる角度に切り替える */
document.getElementById('flipBtn').addEventListener('click', () => { pol = Math.PI - pol; });
/* 船を追う: 押すたびに追尾対象を次の船へ切り替える（従来は航行中の
   最初の船に固定で、対象を選べなかった） */
let followId = null, followIdx = -1;
document.getElementById('shipBtn').addEventListener('click', () => {
  followIdx = (followIdx + 1) % SCHED.ships.length;
  followId = SCHED.ships[followIdx].id;
  document.getElementById('shipBtn').textContent = '追尾中：' + SCHED.ships[followIdx].name;
});
/* ドラッグで回転、2本指ピンチで拡大縮小（モバイルにはホイールがないため） */
const pointers = new Map();
let lx = 0, ly = 0, pinchD = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);
  lx = e.clientX; ly = e.clientY;
  if (pointers.size === 2) { const [p, q] = [...pointers.values()]; pinchD = Math.hypot(p.x - q.x, p.y - q.y); }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    if (pinchD > 0 && d > 0) { dist *= pinchD / d; dist = Math.max(3000, Math.min(3000000, dist)); }
    pinchD = d;
    lx = e.clientX; ly = e.clientY;
    return;
  }
  az -= (e.clientX - lx) * 0.005; pol -= (e.clientY - ly) * 0.005;
  pol = Math.max(0.08, Math.min(Math.PI - 0.08, pol));
  lx = e.clientX; ly = e.clientY;
});
const endPointer = e => { pointers.delete(e.pointerId); pinchD = 0; };
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => { e.preventDefault(); dist *= (e.deltaY > 0 ? 1.12 : 0.89); dist = Math.max(3000, Math.min(3000000, dist)); }, { passive: false });
function relayout() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', relayout);
/* モバイルの向き変更では寸法の確定が resize より遅れることがあるため、
   少し置いてから測り直す */
addEventListener('orientationchange', () => { relayout(); setTimeout(relayout, 300); });

function fmtClock(t) {
  const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60);
  return 'T+' + d + '日 ' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function frame() {
  const target = T_OFFSET + (performance.now() - t0) / 1000 * SPEED;
  /* 追いつきは1フレームあたり上限を設けて分割する: タブが背面に回ると
     rAF が止まり、復帰時に数千秒分を一度に進めることになって画面が
     固まる/飛ぶ。遅れは数フレームかけて取り戻す */
  if (target > world.now) WorldDrive.advanceTo(world, Math.min(target, world.now + 240));
  const snap = WorldDrive.snapshot(world);
  const host = snap.planets.find(p => p.name === 'つむぎ');
  const moon = snap.planets.find(p => p.name === '衛星「こよみ」') || snap.planets.find(p => p.name === 'こよみ');
  const hostPos = V3(host), moonPos = V3(moon), stPos = V3(snap.station);

  hostMesh.position.copy(hostPos);
  moonMesh.position.copy(moonPos);
  stationMesh.position.copy(stPos);
  setOrbitCircle(moonOrbit, hostPos, moonPos, moon, host, 'moon');
  setOrbitCircle(stationOrbit, hostPos, stPos, snap.station, host, 'station');
  stationMark.position.copy(stPos);

  /* 光源は恒星の方向（原点）から */
  sunLight.position.set(-hostPos.x * 0.1 + 500000, 300000, -hostPos.z * 0.1 + 200000);

  /* 視点の中心と極軸：近傍ビューでは対象の軌道面の法線を極軸にして、
     軌道を斜め上から見る形にする（世界の基本面基準だと軌道面が真横に
     潰れて、回っている様子が見えない） */
  let center = hostPos, focusShip = null, pole = null;
  if (viewMode === 'host') pole = orbitNormals.station;
  if (viewMode === 'moon') { center = moonPos; pole = orbitNormals.moon; }
  /* 宙域全体と船追従でも系の公転面法線を極軸にする: 世界の y 軸基準だと
     軌道面の下側に回った時に up が反転して上下感覚が壊れる（2026-11-22
     本人指摘「下からの角度で見れない」）。法線を up に固定すれば、
     下側からでも軌道面を基準に見上げられる */
  if (viewMode === 'wide' || viewMode === 'ship') pole = orbitNormals.moon;
  if (viewMode === 'ship') {
    focusShip = (followId && snap.ships.find(s => s.id === followId))
      || snap.ships.find(s => !s.dockedAt) || snap.ships[0];
    if (focusShip) center = V3(focusShip);
  }
  let off;
  if (pole) {
    const e1 = new THREE.Vector3(1, 0, 0);
    if (Math.abs(pole.dot(e1)) > 0.9) e1.set(0, 0, 1);
    const u = new THREE.Vector3().crossVectors(pole, e1).normalize();
    const w = new THREE.Vector3().crossVectors(pole, u);
    off = u.multiplyScalar(Math.sin(pol) * Math.cos(az) * dist)
      .add(w.multiplyScalar(Math.sin(pol) * Math.sin(az) * dist))
      .add(pole.clone().multiplyScalar(Math.cos(pol) * dist));
    camera.up.copy(pole);
  } else {
    off = new THREE.Vector3(Math.sin(pol) * Math.cos(az), Math.cos(pol), Math.sin(pol) * Math.sin(az)).multiplyScalar(dist);
    camera.up.set(0, 1, 0);
  }
  camera.position.copy(center).add(off);
  camera.lookAt(center);
  starPoints.position.copy(camera.position);
  camera.near = Math.max(1, dist / 1000); camera.far = dist * 40 + 8000000;
  camera.updateProjectionMatrix();

  /* マーカーはカメラ距離に応じた大きさ（情報層：見かけ一定） */
  const markSize = dist * 0.012;
  stationMark.scale.setScalar(markSize);
  stationMark.rotation.y += 0.01;

  for (const sh of snap.ships) {
    const p = V3(sh);
    const mk = shipMarks[sh.id];
    mk.position.copy(p); mk.scale.setScalar(markSize * 0.8); mk.rotation.y -= 0.013;
    const tr = shipTrails[sh.id];
    if (!sh.dockedAt && world.now - tr.lastT > 90) {
      tr.lastT = world.now;
      tr.pts.push(p.x - hostPos.x, p.y - hostPos.y, p.z - hostPos.z);
      if (tr.pts.length > 6000 * 3) tr.pts.splice(0, 3 * 600);
      const attr = tr.line.geometry.getAttribute('position');
      for (let i = 0; i < tr.pts.length; i++) attr.array[i] = tr.pts[i];
      attr.needsUpdate = true;
      tr.line.geometry.setDrawRange(0, tr.pts.length / 3);
      tr.line.position.copy(hostPos);
    }
    if (sh.dockedAt && tr.pts.length) { tr.pts.length = 0; tr.line.geometry.setDrawRange(0, 0); }
  }

  /* 目的地への破線とラベル（航行中の船だけ） */
  moonMark.position.copy(moonPos); moonMark.scale.setScalar(markSize * 0.7);
  for (const sh of snap.ships) {
    const dl = shipDestLines[sh.id];
    const wship = world.ships.find(x => x.id === sh.id);
    const fil = wship && wship.filing && !wship.filing.arrived ? wship.filing : null;
    if (!sh.dockedAt && fil) {
      const dest = fil.arriveBodyName === 'station' ? snap.station : snap.planets.find(p => p.name === fil.arriveBodyName);
      if (dest) {
        const a = V3(sh), b = V3(dest);
        const attr = dl.geometry.getAttribute('position');
        attr.setXYZ(0, a.x, a.y, a.z); attr.setXYZ(1, b.x, b.y, b.z);
        attr.needsUpdate = true;
        dl.computeLineDistances();
        dl.visible = true;
        shipLabels[sh.id].innerHTML = (sh.name || sh.id) + ' <small>→ ' + fil.toName + '</small>';
      } else dl.visible = false;
    } else {
      dl.visible = false;
      shipLabels[sh.id].textContent = sh.name || sh.id;
    }
  }

  /* ラベル（重なりやすい中心部は上下にずらす） */
  placeLabel(hostLabel, hostPos, true, 16);
  placeLabel(moonLabel, moonPos, true);
  placeLabel(stationLabel, stPos, true, -16);
  for (const sh of snap.ships) placeLabel(shipLabels[sh.id], V3(sh), true);

  renderer.render(scene, camera);

  document.getElementById('clock').textContent = fmtClock(world.now) + '（×8）';
  document.getElementById('ships').innerHTML = snap.ships.map(sh =>
    (sh.name || sh.id) + '：' + (sh.dockedAt ? sh.dockedAt + ' に係留' : '航行中（' + (shipRoutes[sh.id] || '') + '）') + '　Δv ' + (Math.round(sh.dvUsed * 100) / 100)).join('<br>');
  if (world.events.length > shownEvents) {
    shownEvents = world.events.length;
    document.getElementById('log').innerHTML = world.events.slice(-6).map(e => {
      const what = e.type === 'depart' ? (e.from + ' を出発 → ' + e.to)
        : e.type === 'arrive' ? (e.at + ' に到着')
        : e.type === 'land' ? (e.at + ' に着陸')
        : e.type === 'filed' ? '次の便を申告'
        : '噴射 ' + (e.cost != null ? Math.round(e.cost * 100) / 100 : '');
      return fmtClock(e.t) + '　' + (shipNames[e.shipId] || e.shipId) + '　' + what;
    }).join('<br>');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
