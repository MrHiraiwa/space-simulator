<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>観覧 — 運行中の世界</title>
<style>
  html, body { margin: 0; padding: 0; background: #060a14; color: #dfe8f5; font-family: sans-serif; height: 100%; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; top: 10px; left: 12px; font-size: 13px; line-height: 1.6; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #hud .clock { font-size: 18px; font-weight: bold; }
  #log { position: absolute; left: 12px; bottom: 10px; font-size: 12px; line-height: 1.7; pointer-events: none; text-shadow: 0 1px 3px #000; opacity: 0.92; }
  #ships { position: absolute; top: 10px; right: 12px; font-size: 12px; line-height: 1.7; text-align: right; pointer-events: none; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"><div class="clock" id="clock">—</div><div>つむぎ宙域（観覧モード）</div></div>
<div id="ships"></div>
<div id="log"></div>
<script src="flight-core.js"></script>
<script src="world-drive.js"></script>
<script src="schedule.js"></script>
<script>
'use strict';
const SCHED = window.WATCH_SCHEDULE;
const world = WorldDrive.createWorld(SCHED.sys, SCHED.stationDef);
for (const s of SCHED.ships) WorldDrive.addShip(world, s.id, s.name);
for (const f of SCHED.filings) WorldDrive.filePlan(world, f);

const SPEED = 8; /* 世界の基準速度（#149） */
const t0 = performance.now();
let shownEvents = 0;
const trails = {}; /* shipId -> [[x,y],...] つむぎ相対 */
for (const s of SCHED.ships) trails[s.id] = [];
let lastTrailT = -1;

const cv = document.getElementById('view');
const ctx = cv.getContext('2d');
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();

function fmtClock(t) {
  const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60);
  return 'T+' + d + '日 ' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function frame() {
  const target = (performance.now() - t0) / 1000 * SPEED;
  if (target > world.now) WorldDrive.advanceTo(world, target);
  const snap = WorldDrive.snapshot(world);
  const host = snap.planets.find(p => p.name === 'つむぎ');
  const moon = snap.planets.find(p => p.name === '衛星「こよみ」') || snap.planets.find(p => p.name === 'こよみ');
  const W = cv.width, H = cv.height;
  const scale = Math.min(W, H) / 2 / 460000; /* 月軌道が収まる範囲 */
  const px = (x) => W / 2 + (x - host.x) * scale;
  const py = (y) => H / 2 - (y - host.y) * scale;
  ctx.fillStyle = '#060a14'; ctx.fillRect(0, 0, W, H);

  /* 軌道の目安（月軌道） */
  ctx.strokeStyle = 'rgba(140,170,220,0.18)'; ctx.beginPath(); ctx.arc(px(host.x), py(host.y), 360000 * scale, 0, Math.PI * 2); ctx.stroke();

  /* 船の軌跡 */
  if (world.now - lastTrailT > 120) {
    lastTrailT = world.now;
    for (const sh of snap.ships) { const tr = trails[sh.id]; tr.push([sh.x - host.x, sh.y - host.y]); if (tr.length > 4000) tr.shift(); }
  }
  ctx.lineWidth = 1;
  for (const sh of snap.ships) {
    const tr = trails[sh.id]; if (tr.length < 2) continue;
    ctx.strokeStyle = 'rgba(255,190,120,0.5)'; ctx.beginPath();
    tr.forEach((pt, i) => { const X = W / 2 + pt[0] * scale, Y = H / 2 - pt[1] * scale; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.stroke();
  }

  /* 天体 */
  const dot = (x, y, r, color, label) => {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px(x), py(y), Math.max(r, 2), 0, Math.PI * 2); ctx.fill();
    if (label) { ctx.fillStyle = '#cfe0f5'; ctx.font = '12px sans-serif'; ctx.fillText(label, px(x) + 8, py(y) - 6); }
  };
  dot(host.x, host.y, 6400 * scale, '#8fe3a0', 'つむぎ');
  if (moon) dot(moon.x, moon.y, 2600 * scale, '#9fb4c8', 'こよみ');
  dot(snap.station.x, snap.station.y, 2.5, '#2dd4bf', 'あおば');
  for (const sh of snap.ships) {
    if (sh.dockedAt) continue;
    dot(sh.x, sh.y, 2.5, '#ffbe78', sh.name || sh.id);
  }

  document.getElementById('clock').textContent = fmtClock(world.now) + '（×8）';
  document.getElementById('ships').innerHTML = snap.ships.map(sh =>
    (sh.name || sh.id) + '：' + (sh.dockedAt ? sh.dockedAt + ' に係留' : '航行中') + '　Δv ' + (Math.round(sh.dvUsed * 100) / 100)).join('<br>');
  if (world.events.length > shownEvents) {
    shownEvents = world.events.length;
    const names = {}; for (const s of SCHED.ships) names[s.id] = s.name;
    document.getElementById('log').innerHTML = world.events.slice(-6).map(e => {
      const what = e.type === 'depart' ? (e.from + ' を出発 → ' + e.to) : e.type === 'arrive' ? (e.at + ' に到着') : '噴射 ' + (e.cost != null ? Math.round(e.cost * 100) / 100 : '');
      return fmtClock(e.t) + '　' + (names[e.shipId] || e.shipId) + '　' + what;
    }).join('<br>');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
